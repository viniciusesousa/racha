<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Faz a página se ajustar à largura do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Pede aos buscadores (Google etc.) para NÃO listar o site: o link circula só no grupo -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Cor da barra do navegador no celular (grená; grená bem escuro no modo escuro) -->
  <meta name="theme-color" content="#6d1f2f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#3d1119" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Racha de Quinta</title>
  <link rel="icon" type="image/png" href="img/escudo-256.png">
  <!-- App instalável (PWA): nome, cores e ícones para a tela inicial do celular -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/icone-apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Racha">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Fontes do Google: Barlow Condensed (números, estilo placar) e Inter (textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Cabeçalho fixo no topo, com o título da tela atual -->
  <header class="topo">
    <div class="topo-conteudo">
    <img class="topo-escudo" id="topo-escudo" src="img/escudo-256.png" alt="">
    <button class="topo-voltar" id="botao-voltar" type="button" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 id="titulo-tela">Racha de Quinta</h1>
    </div>
  </header>

  <!-- Área onde o app.js desenha o conteúdo de cada tela -->
  <main id="conteudo" class="conteudo" aria-live="polite">
    <!-- Esqueleto de carregamento (some quando os dados chegam) -->
    <div aria-busy="true" aria-label="Carregando">
      <ul class="lista">
        <li class="esqueleto-linha"><span class="esqueleto esqueleto-circulo"></span><span class="esqueleto-textos"><span class="esqueleto esqueleto-texto"></span><span class="esqueleto esqueleto-texto curto"></span></span><span class="esqueleto esqueleto-valor"></span></li>
        <li class="esqueleto-linha"><span class="esqueleto esqueleto-circulo"></span><span class="esqueleto-textos"><span class="esqueleto esqueleto-texto"></span><span class="esqueleto esqueleto-texto curto"></span></span><span class="esqueleto esqueleto-valor"></span></li>
        <li class="esqueleto-linha"><span class="esqueleto esqueleto-circulo"></span><span class="esqueleto-textos"><span class="esqueleto esqueleto-texto"></span><span class="esqueleto esqueleto-texto curto"></span></span><span class="esqueleto esqueleto-valor"></span></li>
      </ul>
    </div>
  </main>

  <!-- Barra de abas na parte de baixo da tela -->
  <nav class="abas" aria-label="Navegação principal">
    <div class="abas-conteudo">
    <a class="aba" href="#inicio" data-aba="inicio">
      <!-- Ícone de casa -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 11l8-7 8 7M6 9.5V20h4.5v-5.5h3V20H18V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Início</span>
    </a>
    <a class="aba" href="#rankings" data-aba="rankings">
      <!-- Ícone de troféu -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8M10 17h4"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Rankings</span>
    </a>
    <a class="aba" href="#rachas" data-aba="rachas">
      <!-- Ícone de calendário -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10h16M9 3v4M15 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Rachas</span>
    </a>
    <a class="aba" href="#jogadores" data-aba="jogadores">
      <!-- Ícone de pessoas -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M15.5 5.2a3 3 0 0 1 0 5.6M17.5 14.3c1.8.6 3 2.2 3.5 4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Jogadores</span>
    </a>
    </div>
  </nav>

  <!-- Biblioteca oficial do Supabase, carregada direto da internet (CDN), sem instalação -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!-- Endereço e chave pública do banco -->
  <script src="config.js"></script>
  <!-- Lógica das telas -->
  <script src="app.js"></script>
</body>
</html>
